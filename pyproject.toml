[project]
name = "ai-cover-letter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi==0.109.2",
    "google-generativeai>=0.3.1",
    "langchain==0.1.0",
    "langchain-google-genai==0.0.5",
    "passlib==1.7.4",
    "prettier>=0.0.7",
    "pydantic==2.3.0",
    "pylint>=3.3.6",
    "python-dotenv==1.0.0",
    "python-jose[all]>=3.3.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.20",
    "requests==2.31.0",
    "sqlalchemy==2.0.23",
    "uvicorn==0.24.0",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
addopts = "-s -v"
pythonpath = "."
testpaths = [
    "tests"
]
asyncio_mode = "auto"
